name: Publish to PyPI

# Trusted publishing: PyPI accepts the upload because GitHub vouches for this
# workflow via OIDC, so there is no API token anywhere — not in the repo, not
# in a secret, not on a laptop. A leaked token is the failure this avoids.
#
# Fires on a release tag rather than on push, so publishing is an act someone
# takes deliberately. A version cannot be re-uploaded once it exists, which
# makes an accidental publish permanent.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:  # first release, before any tag convention exists

jobs:
  build:
    runs-on: ubuntu-latest
    # Without this a hung step burns the full 6h GitHub cap and the run reads as
    # "still going" rather than "stuck" — so nothing reports a failure at all.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # NOTHING RAN THE TESTS BEFORE AN UPLOAD. This job was checkout, build,
      # import-smoke, upload — and the smoke proves the package IMPORTS
      # without claude-swap, which says nothing about whether it still works.
      # Three releases went out on the strength of a developer's local run,
      # with no machine anywhere checking. A version cannot be un-uploaded, so
      # the one gate that matters has to be the one before the upload.
      #
      # In the BUILD job deliberately: `publish` needs `build`, so a failure
      # here means the publish job never starts and the tag produces no
      # release at all.
      - name: The suite must pass before anything is uploaded
        run: |
          # HOME and XDG_DATA_HOME redirected: the suite drives real cert
          # dirs and daemon state, and a runner's real HOME is the one place
          # a test must never write.
          #
          # `--with claude-swap` because the suite imports the HOST. cswap-pin
          # is a peer, not a dependency (see pyproject), so nothing installs
          # it for us — and without it collection dies with HostMissing, which
          # is precisely why no CI had ever run these tests.
          #
          # THE RELEASED HOST, deliberately. Testing against a developer's
          # checkout would gate on a seam users cannot install yet; testing
          # against the release gates on what a `pip install cswap-pin` world
          # actually looks like. The cost is that tests of an UNRELEASED seam
          # fail here — those are marked `needs_host_seam` and deselected, not
          # silently skipped, so the exclusion is visible in the log.
          S="$(mktemp -d)"
          HOME="$S" XDG_DATA_HOME="$S/.local/share" \
            uv run --with pytest --with cryptography --with claude-swap \
            python -m pytest tests/ -q -p no:randomly \
            -m "not needs_host_seam"
      - run: uv build
      # The wheel is what users install; a build that produces an importable
      # package but a broken one still uploads cleanly. Import it from the
      # built artifact, not from the checkout, so this tests what ships.
      - name: The built wheel must import without claude-swap
        run: |
          python3 -m venv /tmp/check
          /tmp/check/bin/pip install dist/*.whl
          /tmp/check/bin/python -c '
          import cswap_pin
          assert cswap_pin.host_available() is False, "host_available lied with no host installed"
          print("ok", cswap_pin.__version__)'
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write  # mint the OIDC token PyPI verifies; nothing else needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # Trusted publishing needs a publisher registered on PyPI's side, and it
      # is NOT registered for this project: both 0.1.1 and 0.1.2 failed here
      # with `invalid-publisher` while the release itself went out by hand.
      # A workflow that fails on every release trains people to ignore it, and
      # the manual fallback leaves no record of what was uploaded.
      #
      # So: OIDC when the publisher exists, an API token when it does not, and
      # a loud failure when NEITHER is available — rather than the silent
      # divergence where the tag says released and PyPI says otherwise.
      - name: Publish via trusted publishing
        id: oidc
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
      # `secrets` is not available in an `if:` expression, so the presence of
      # the token is hoisted into a job-level output first. Referencing it
      # directly makes the condition silently false and the step never runs.
      - name: Note whether a token is configured
        id: tok
        if: steps.oidc.outcome == 'failure'
        env:
          TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "have=true" >> "$GITHUB_OUTPUT"
          else echo "have=false" >> "$GITHUB_OUTPUT"; fi
      - name: Publish with an API token
        if: steps.oidc.outcome == 'failure' && steps.tok.outputs.have == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
      - name: Fail if nothing published
        if: steps.oidc.outcome == 'failure' && steps.tok.outputs.have != 'true'
        run: |
          echo "::error::Trusted publishing was refused (invalid-publisher) and"
          echo "::error::no PYPI_API_TOKEN secret is set, so NOTHING was uploaded."
          echo "::error::Register the publisher at"
          echo "::error::https://pypi.org/manage/project/cswap-pin/settings/publishing/"
          echo "::error::  owner: codeslake   repo: cswap-pin"
          echo "::error::  workflow: publish.yml   environment: pypi"
          echo "::error::or add a PYPI_API_TOKEN repository secret."
          exit 1
